services:
    laravel.test:
        build:
            context: ./docker/8.2
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.2/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-8000}:8000'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
            - '${QA_PORT:-8001}:8001'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            PHP_CLI_SERVER_WORKERS: '${PHP_CLI_SERVER_WORKERS:-4}'
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - .:/var/www/html
            - ./docker/8.2/php.ini:/etc/php/8.2/cli/conf.d/99-sail.ini
        networks:
            - sail
        depends_on:
            - mysql
            - redis
            - mailpit

    # Runs the queued jobs (emails, reminders, delayed payouts). Without it nothing queued ever happens.
    queue:
        image: sail-8.2/app
        command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
        restart: unless-stopped
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - .:/var/www/html
            - ./docker/8.2/php.ini:/etc/php/8.2/cli/conf.d/99-sail.ini
        networks:
            - sail
        depends_on:
            - mysql
            - redis

    # Runs the scheduler (live-session and in-person reminders, nightly database backup, heartbeats). In production a cron
    # entry `* * * * * php artisan schedule:run` does the same job.
    scheduler:
        image: sail-8.2/app
        command: php artisan schedule:work
        restart: unless-stopped
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - .:/var/www/html
            - ./docker/8.2/php.ini:/etc/php/8.2/cli/conf.d/99-sail.ini
        networks:
            - sail
        depends_on:
            - mysql
            - redis

    mysql:
        image: 'mysql/mysql-server:8.0'
        container_name: horizontia_mysql
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:-root}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './docker/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/create-testing-database.sh'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s

    redis:
        image: 'redis:alpine'
        container_name: horizontia_redis
        ports:
            - '${FORWARD_REDIS_PORT:-6380}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s

    mailpit:
        image: 'axllent/mailpit:latest'
        container_name: horizontia_mailpit
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail

networks:
    sail:
        driver: bridge

volumes:
    sail-mysql:
    sail-redis:
